name: Feature request
description: Suggest a compatible, credential-free improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What reading or synchronization problem should be solved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Relevant Kindle firmware

  - type: checkboxes
    id: credential_free
    attributes:
      label: Security
      options:
        - label: The proposal does not require storing Amazon or Goodreads credentials in the plugin.
          required: true
