name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y lua5.1 shellcheck zip

      - name: Build
        run: make build

      - name: Check
        run: make check

      - name: Package
        run: make package

      - uses: actions/upload-artifact@v4
        with:
          name: goodreads-native-koreader
          path: dist/*
